openapi: 3.0.3
info:
  title: API de Gestión de Cursos
  description: Especificación OpenAPI para la gestión de cursos académicos y la inscripción de estudiantes.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
    description: Servidor Local de Desarrollo

paths:
  /cursos:
    get:
      summary: Obtener todos los cursos
      description: Retorna una lista con todos los cursos disponibles en la plataforma.
      responses:
        '200':
          description: Lista de cursos obtenida con éxito
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Curso'

    post:
      summary: Crear un nuevo curso
      description: Registra un nuevo curso en el sistema.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoCurso'
      responses:
        '201':
          description: Curso creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
        '400':
          description: Datos de entrada inválidos

  /cursos/{id}:
    get:
      summary: Obtener un curso por ID
      description: Retorna los detalles de un curso específico dado su identificador único.
      parameters:
        - name: id
          in: path
          required: true
          description: ID único del curso
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Curso encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
        '404':
          description: Curso no encontrado

  /cursos/{id}/inscripciones:
    post:
      summary: Inscribir un estudiante a un curso
      description: Registra la inscripción de un estudiante en el curso especificado.
      parameters:
        - name: id
          in: path
          required: true
          description: ID del curso al que se desea inscribir
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Inscripcion'
      responses:
        '201':
          description: Estudiante inscrito exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InscripcionRespuesta'
        '404':
          description: Curso no encontrado
        '400':
          description: Error en la solicitud de inscripción

components:
  schemas:
    Curso:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nombre:
          type: string
          example: "Sistemas Operativos"
        codigo:
          type: string
          example: "SO-101"
        creditos:
          type: integer
          example: 5
        profesor:
          type: string
          example: "Ing. Carlos Mendoza"

    NuevoCurso:
      type: object
      required:
        - nombre
        - codigo
        - creditos
      properties:
        nombre:
          type: string
          example: "Bases de Datos I"
        codigo:
          type: string
          example: "BD-201"
        creditos:
          type: integer
          example: 4
        profesor:
          type: string
          example: "Ing. Ana Lucía Morales"

    Inscripcion:
      type: object
      required:
        - estudianteId
        - nombreEstudiante
      properties:
        estudianteId:
          type: integer
          format: int64
          example: 20250012
        nombreEstudiante:
          type: string
          example: "Yeimy Hernández"

    InscripcionRespuesta:
      type: object
      properties:
        idInscripcion:
          type: integer
          format: int64
          example: 501
        cursoId:
          type: integer
          format: int64
          example: 1
        estudianteId:
          type: integer
          format: int64
          example: 20250012
        fechaInscripcion:
          type: string
          format: date-time
          example: "2026-09-17T10:00:00Z"
        estado:
          type: string
          example: "INSCRITO"